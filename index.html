          "@type": "Question",
          "name": "¿Cuánto cuesta el tour en lancha por la Ría de Celestún?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El Tour Ría Celestún tiene un precio de $4,100 MXN por lancha privada (1-6 personas). Incluye guía federal certificado, recorrido de 1 hora 20 minutos con visita a flamingos, Isla de Pájaros, túnel de manglares y ojo de agua dulce."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuál es la mejor temporada para ver flamingos en Celestún?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Aunque puedes ver flamingos todo el año, la temporada alta va de noviembre a marzo, cuando miles de aves se concentran en la Ría para alimentarse. Los meses de diciembre y enero son ideales para ver las colonias más grandes."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo llego a Celestún desde Mérida?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Celestún se encuentra a aproximadamente 1 hora 30 minutos en auto desde Mérida por la carretera Mérida-Celestún. También hay autobuses que salen de la terminal Noreste de Mérida."
          }
        },
        {
          "@type": "Question",
          "name": "¿Los tours son privados o compartidos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Todos nuestros tours son 100% privados. La lancha o el tuk-tuk será exclusivamente para tu grupo, sin compartir con otros turistas."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué incluye el Tour Terrestre de las Salineras?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El Tour Terrestre ($1,700 MXN, 2-4 personas) incluye recorrido en Tuk-Tuk por las Aguas Rosas, visita a la Hacienda Salinera 'La Herradura del Siglo XXI', bosque petrificado y avistamiento de aves. Duración: 1 hora 30 minutos."
          }
        },
        {
          "@type": "Question",
          "name": "¿Necesito reservar con anticipación?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí, recomendamos reservar al menos 24 horas antes, especialmente en temporada alta (noviembre-marzo). Puedes reservar por WhatsApp, correo electrónico o a través de nuestro formulario de contacto."
          }
        },
        {
          "@type": "Question",
          "name": "¿Es seguro el tour en lancha?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutamente. Nuestro capitán es originario de Celestún, certificado por la NOM-08-TUR-2002 y cuenta con años de experiencia navegando la Ría. Las lanchas cuentan con equipo de seguridad completo y chalecos salvavidas."
          }
        },
        {
          "@type": "Question",
          "name": "¿Pueden llevar niños en los tours?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "¡Sí! Los tours son aptos para todas las edades. Los niños disfrutan especialmente del avistamiento de flamingos y el túnel de manglares. Contamos con chalecos salvavidas infantiles."
          }
        }
